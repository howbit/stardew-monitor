<body class="landscape-preview" data-farm-art="native">
  <script>document.body.dataset.season = estateStart.season; document.body.classList.toggle("night", estateStart.night);</script>
  <main class="page-shell">
    <section class="monitor-page preview" aria-label="星谷哨站监控面板">
      <header class="farm-hero">
        <div class="hero-sky" aria-hidden="true"></div>
        <div class="site-sign"><img class="sign-frame" src="assets/ui/estate/title.png?stardew_v=c3f9c5d114c6" width="180" height="85" alt="" aria-hidden="true"><div class="site-sign-copy"><strong>星谷哨站</strong></div></div>
        <div class="time-sign"><span class="time-frame" aria-hidden="true"></span><div class="time-sign-copy"><span id="season-time"></span><strong></strong><a id="farm-temperature" target="_blank" rel="noopener noreferrer">—°C</a></div><button class="weather-symbol" id="farm-weather" type="button" aria-label="查看天气来源或更新本地定位"></button></div>
        <div class="scene-music" role="group" aria-label="场景配乐" data-state="off">
          <div class="music-track-copy" role="status" aria-live="polite"><span id="music-status">场景配乐</span><span id="music-current">配乐随季节与昼夜切换</span></div>
          <div class="music-actions">
            <button id="music-toggle" type="button" aria-pressed="false" aria-label="播放配乐" title="播放配乐"><span class="music-symbol" aria-hidden="true"></span></button>
          </div>
        </div>
        <div class="hero-viewport"><div class="hero-scene">
          <!-- Size the camera before the browser encounters the poster, even on a cached reload. -->
          <script src="assets/app/estate-camera.js?stardew_v=c3f9c5d114c6"></script>
          <img class="hero-art" width="2240" height="832" alt="春日农场全景，石路围合中央春季作物田和祝尼魔小屋，左侧是温室、彩色鱼塘与作坊，右侧是畜棚、牧草地和天然池塘" fetchpriority="high">
          <script>document.querySelector(".hero-art").src = farmAsset("assets/landscape/native-spring-estate/" + estateStart.season + (estateStart.night ? "-night.png" : "-day.png"));</script>
          <!-- Only the rail regions of the generated repair are visible; v6 remains the backdrop. -->
          <svg class="hero-rail-repair" viewBox="0 0 2172 724" aria-hidden="true" focusable="false">
            <defs><clipPath id="spring-rail-regions">
              <path d="M260 640 L308 620 L359 604 L437 590 L510 590 L582 605 L664 632 L664 661 L583 637 L510 623 L437 623 L360 635 L310 650 L260 666 Z"/>
              <path d="M1206 519 L1340 503 L1340 564 L1206 581 Z M1379 500 H1443 V551 H1379 Z M1820 501 L1891 510 L1891 563 L1820 553 Z M1941 510 L2042 532 L2042 592 L1941 569 Z M2091 540 L2172 548 L2172 617 L2091 595 Z"/>
            </clipPath></defs>
            <g clip-path="url(#spring-rail-regions)">
              <image class="rail-day" data-href="assets/landscape/spring-rail-repair-v1/hero-day.png?stardew_v=c3f9c5d114c6" width="2172" height="724"/>
              <image class="rail-night" data-href="assets/landscape/spring-rail-repair-v1/hero-night.png?stardew_v=c3f9c5d114c6" width="2172" height="724"/>
            </g>
          </svg>
          <div class="crop-layer" data-crop-season="spring" role="img" aria-label="春季田地：防风草、土豆、花椰菜、青豆和草莓，两排种植"></div>
          <div class="crop-layer" data-crop-season="summer" role="img" aria-label="夏季田地：蓝莓、甜瓜、番茄和玉米，两排种植"></div>
        </div></div>
        <div class="hero-grass-fringe" aria-hidden="true"></div>
        <div class="seasonal-particles" aria-hidden="true">
          <!-- 春季微风落樱 -->
          <span class="p-spring-petal p-1"></span><span class="p-spring-petal p-2"></span><span class="p-spring-petal p-3"></span>
          <span class="p-spring-petal p-4"></span><span class="p-spring-petal p-5"></span><span class="p-spring-petal p-6"></span>
          <span class="p-spring-petal p-7"></span><span class="p-spring-petal p-8"></span><span class="p-spring-petal p-9"></span>
          <span class="p-spring-petal p-10"></span><span class="p-spring-petal p-11"></span><span class="p-spring-petal p-12"></span>
          <!-- 夏季水面反光与自然微涟漪（去掉泡泡，只保留河面清波反光与微涟漪） -->
          <span class="p-summer-shimmer s-1"></span><span class="p-summer-shimmer s-2"></span><span class="p-summer-shimmer s-3"></span><span class="p-summer-shimmer s-4"></span><span class="p-summer-shimmer s-5"></span>
          <span class="p-summer-ripple r-1"></span><span class="p-summer-ripple r-2"></span><span class="p-summer-ripple r-3"></span>
          <span class="p-summer-ripple r-4"></span><span class="p-summer-ripple r-5"></span>
          <!-- 秋季旋转红黄落叶 -->
          <span class="p-fall-leaf f-1"></span><span class="p-fall-leaf f-2"></span><span class="p-fall-leaf f-3"></span>
          <span class="p-fall-leaf f-4"></span><span class="p-fall-leaf f-5"></span><span class="p-fall-leaf f-6"></span>
          <span class="p-fall-leaf f-7"></span><span class="p-fall-leaf f-8"></span><span class="p-fall-leaf f-9"></span>
          <span class="p-fall-leaf f-10"></span>
          <!-- 冬季静谧细雪 -->
          <span class="p-winter-snow w-1"></span><span class="p-winter-snow w-2"></span><span class="p-winter-snow w-3"></span>
          <span class="p-winter-snow w-4"></span><span class="p-winter-snow w-5"></span><span class="p-winter-snow w-6"></span>
          <span class="p-winter-snow w-7"></span><span class="p-winter-snow w-8"></span><span class="p-winter-snow w-9"></span>
          <span class="p-winter-snow w-10"></span><span class="p-winter-snow w-11"></span><span class="p-winter-snow w-12"></span>
          <span class="p-winter-snow w-13"></span><span class="p-winter-snow w-14"></span><span class="p-winter-snow w-15"></span>
          <span class="p-winter-snow w-16"></span>
        </div>
      </header>

      <section class="summary-strip" aria-label="服务器统计">
        <div class="stats" data-stats data-asset-root="assets/stats"></div>
      </section>

      <section class="content-panel">
        <div class="content-controls">
          <div class="content-heading">
            <div class="heading-left">
              <div class="node-list-title"><h1>我的服务器</h1><small id="node-demo-note" hidden>示例数据</small></div>
              <div class="region-tabs" role="group" aria-label="地区筛选">
                <button class="region-tab active" data-region="all" type="button" aria-pressed="true">全部</button>
              </div>
            </div>
            <div class="heading-right">
              <div class="tools-group scene-controls">
                <span id="scene-label">本地场景</span>
                <label class="season-select"><select id="season-preview" aria-label="季节预览"><option value="auto">自动 (天时联动)</option><option value="spring">春季</option><option value="summer">夏季</option><option value="fall">秋季</option><option value="winter">冬季</option></select></label>
                <button id="return-local" class="tool-button" type="button" style="display:none;" title="切回访客本地农场场景">返回本地农场</button>
              </div>
              <div class="view-switch node-toolbar" role="group" aria-label="节点视图、搜索与昼夜">
                <button class="node-tool view-opt active" data-view="grid" type="button" aria-label="卡片视图" title="卡片视图" aria-pressed="true">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                </button>
                <button class="node-tool view-opt" data-view="list" type="button" aria-label="列表视图" title="列表视图" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 10h18M10 3v18"/></svg>
                </button>
                <label class="node-search" title="搜索节点">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg>
                  <input class="node-tool" id="search" type="search" placeholder="搜索节点…" aria-label="搜索节点">
                </label>
                <button id="view-mode" class="node-tool" type="button" aria-pressed="false" aria-label="切换昼夜">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path class="mode-moon" d="M20.8 13.2A9 9 0 0 1 10.8 3a9 9 0 1 0 10 10.2Z"/>
                    <g class="mode-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></g>
                  </svg>
                </button>
                <label class="language-tool" title="界面语言">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 6h12M8.5 3v3m3.5 0c-1.1 4.4-4.2 8.1-8.8 10.5M5.2 9a18 18 0 0 0 6.1 6.5M13 21l4.3-11 4.2 11m-7-3.5h5.6"/></svg>
                  <select id="theme-language" aria-label="界面语言"><option value="zh-CN" lang="zh-CN">简体中文</option><option value="en" lang="en">English</option><option value="ja" lang="ja">日本語</option></select>
                </label>
                <a class="node-tool admin-tool" href="/admin#/admin" title="管理后台" aria-label="管理后台"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m10 3-.6 2.1-1.6.9-2.1-.5-2 3.5 1.5 1.6v2.8L3.7 15l2 3.5 2.1-.5 1.6.9.6 2.1h4l.6-2.1 1.6-.9 2.1.5 2-3.5-1.5-1.6v-2.8L20.3 9l-2-3.5-2.1.5-1.6-.9L14 3z"/><circle cx="12" cy="12" r="3.1"/></svg></a>
              </div>
            </div>
          </div>
        </div>
        <div id="monitor-access" class="monitor-access" hidden></div>
        <div id="cards" class="cards node-menu"></div>
      </section>

      <div id="seasonal-footer" class="seasonal-footer" aria-label="四季像素景观收尾">
        <div class="footer-flora" aria-hidden="true">
          <img class="flora-img"  alt="" width="320" height="104">
        </div>
        <div class="footer-credit">
          <a href="https://github.com/huilang-me/CF-Server-Monitor" target="_blank" rel="noopener noreferrer" class="credit-link">Powered by CF-Server-Monitor</a>
        </div>
        <div class="footer-fence" aria-hidden="true">
          <img class="fence-img"  alt="" width="320" height="104">
        </div>
      </div>
    </section>
  </main>
